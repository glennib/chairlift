[tools]
actionlint = "1.7.12"
cargo-binstall = "1.26.2"
"cargo:cargo-dist" = "0.34.0"
"cargo:cargo-edit" = "0.13.14"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-insta" = "1.49.0"
"cargo:cargo-nextest" = "0.9.151"
"cargo:release-plz" = "0.4.3"
# The oracle: provides `clickhouse-format` and `clickhouse local`. Keep in step
# with `CLICKHOUSE_VERSION` in src/lib.rs.
clickhouse = "26.10.2.103-stable"
shellcheck = "0.11.0"

[tasks.fmt]
description = "Format code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy lints (all features)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."clippy:lib"]
description = "Run clippy on the library with no features (consumer contract)"
run = "cargo clippy --lib --no-default-features -- -D warnings"

[tasks."lint:actions"]
description = "Lint GitHub workflows"
run = "actionlint .github/workflows/*.yml"

[tasks."lint:scripts"]
description = "Lint shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.test]
description = "Run tests"
run = "cargo nextest run --all-targets --all-features --no-tests=pass"

[tasks."test:corpus"]
description = "Run the tests that read the fetched corpus or run clickhouse-format, failing instead of skipping if either is missing"
env = { CHAIRLIFT_REQUIRE_CORPUS = "1" }
run = "cargo nextest run --all-features --test corpus --test keywords --test lexer --test oracle --test keyword_positions"

[tasks."test:templates"]
description = "Run tests/template_properties.rs on many generated templates and queries (release build)"
env = { CHAIRLIFT_TEMPLATE_CASES = "50000" }
run = "cargo nextest run --release --all-features --test template_properties"

[tasks."test:keyword-positions"]
description = "Put every keyword and literal word in every position of tests/keyword_positions.rs, and check the re-cased keyword slots with verify and clickhouse-format; fails instead of skipping without clickhouse-format"
env = { CHAIRLIFT_REQUIRE_CORPUS = "1" }
run = "cargo nextest run --all-features --test keyword_positions"

[tasks."test:doc"]
description = "Run doctests (nextest does not run them)"
run = "cargo test --doc --all-features"

[tasks.corpus]
description = "Format every corpus, checking verification and idempotence (release build); pass more options after --, e.g. --csv FILE"
run = "cargo run --release --features corpus-tool --bin corpus -- --default"

[tasks."corpus:oracle"]
description = "Like corpus, and run clickhouse-format on every input and output, statement by statement where it rejects a whole file, and on every render of every template; fails on any difference not in tests/oracle-allowlist.txt"
run = "cargo run --release --features corpus-tool --bin corpus -- --default --oracle --allowlist tests/oracle-allowlist.txt"

[tasks."corpus:templates"]
description = "Render every template of the corpora, input and output, once per combination of its branches and loop count, and compare the SQL of each pair token by token and with clickhouse-format (release build)"
run = "cargo run --release --features corpus-tool --bin corpus -- --default --only-templates --oracle --allowlist tests/oracle-allowlist.txt"

[tasks."corpus:recase"]
description = "Re-case the keyword slots the parser finds in every corpus file, and check that with verify and clickhouse-format"
run = "cargo run --release --features corpus-tool --bin corpus -- --default --recase all --oracle --allowlist tests/oracle-allowlist.txt"

[tasks."corpus:expressions"]
description = "Parse every `SELECT <list>` statement of the corpora as an expression list: report how much parses, and check the re-cased keyword slots with verify and clickhouse-format"
run = "cargo run --release --features corpus-tool --bin corpus -- --default --recase expressions --oracle --allowlist tests/oracle-allowlist.txt"

[tasks.tree]
description = "Print the syntax tree of the files given after --"
run = "cargo run --features corpus-tool --bin corpus -- --tree"

[tasks.build]
description = "Build release binary"
run = "cargo build --release"

[tasks."build:debug"]
description = "Check that the project compiles"
run = "cargo build"

[tasks."build:lib"]
description = "Check the library compiles with no default features"
run = "cargo build --lib --no-default-features"

[tasks.bench]
description = "Run benchmarks"
run = "cargo bench --bench throughput"

[tasks."bench:compare"]
description = "Compare the format benchmark with a base revision or directory given after --, as CI does; fails when more than 10% slower"
run = "scripts/bench-compare.sh"

[tasks."fuzz:check"]
description = "Check that the fuzz targets compile"
run = "cargo check --manifest-path fuzz/Cargo.toml"

[tasks."fuzz:lexer"]
description = "Fuzz the lexer (nightly toolchain); pass libFuzzer options after --, e.g. -max_total_time=600"
# cargo-fuzz defaults to the target it was built for, which for a prebuilt
# binary can be musl; build for the toolchain's host instead.
env = { RUSTUP_TOOLCHAIN = "nightly" }
run = 'cargo fuzz run --target "$(rustc -vV | sed -n "s/^host: //p")" lexer -- -dict=fuzz/lexer.dict'

[tasks."fuzz:format"]
description = "Fuzz chairlift::format: no panic, verification holds, idempotent (nightly toolchain); pass libFuzzer options after --"
env = { RUSTUP_TOOLCHAIN = "nightly" }
# New inputs go to fuzz/corpus/format; fuzz/seeds/format holds whole
# templates and statements.
run = 'mkdir -p fuzz/corpus/format && cargo fuzz run --target "$(rustc -vV | sed -n "s/^host: //p")" format fuzz/corpus/format fuzz/seeds/format -- -dict=fuzz/format.dict'

[tasks."fuzz:parser"]
description = "Fuzz the parser: no panic, lossless tree, re-cased keyword slots verify, parse independent of case (nightly toolchain); pass libFuzzer options after --"
env = { RUSTUP_TOOLCHAIN = "nightly" }
# New inputs go to fuzz/corpus/parser; fuzz/seeds/parser holds whole
# statements, whose first byte picks the mode and entry (see the target), so
# that a fresh run does not start from inputs of a few bytes.
run = 'mkdir -p fuzz/corpus/parser && cargo fuzz run --target "$(rustc -vV | sed -n "s/^host: //p")" parser fuzz/corpus/parser fuzz/seeds/parser -- -dict=fuzz/parser.dict'

[tasks."fuzz:doc"]
description = "Fuzz the document printer on generated documents: no panic, every token once, verification holds, idempotent (nightly toolchain); pass libFuzzer options after --"
env = { RUSTUP_TOOLCHAIN = "nightly" }
run = 'cargo fuzz run --target "$(rustc -vV | sed -n "s/^host: //p")" doc --'

[tasks."corpus:fetch"]
description = "Fetch the ClickHouse and dbt corpora into $CHAIRLIFT_CORPUS_DIR (default corpus/)"
run = "scripts/fetch-corpus.sh"

[tasks."keywords:generate"]
description = "Regenerate src/keyword/generated.rs from the fetched ClickHouse source"
run = "scripts/generate-keywords.sh"

[tasks."keywords:check"]
description = "Check src/keyword/generated.rs against the fetched ClickHouse source"
run = "scripts/generate-keywords.sh --check"

[tasks."oracle:smoke"]
description = "Check that the pinned clickhouse-format runs"
run = "echo 'select 1' | clickhouse-format -n --oneline --show_secrets"

[tasks.ci]
description = "Run all CI checks"
depends = [
  "fmt:check",
  "clippy",
  "clippy:lib",
  "lint:actions",
  "lint:scripts",
  "test",
  "test:doc",
  "build:debug",
  "build:lib",
  "fuzz:check",
]
