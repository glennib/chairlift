[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support. The generated workflow, which runs on tag pushes and
# pull requests, is not checked in while releases are off; `dist generate
# --mode=ci` writes it to .github/workflows/release.yml.
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax). Linux builds
# use musl so the binary is static.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Whether dist should create a Github Release or use an existing draft
create-release = false
