name: Oracle

# Checks against the pinned `clickhouse-format`. Too slow for every push, so it
# runs weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The same cache as the CI workflow's jobs: the sweep runs a mise task,
      # which wants every tool installed.
      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: mise install

      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: corpus
          key: corpus-${{ hashFiles('scripts/fetch-corpus.sh', 'src/bin/corpus/docs.rs') }}
          restore-keys: |
            corpus-

      # Also extracts the docs examples clickhouse-format accepts, which
      # builds the corpus tool the later steps use.
      - name: Fetch corpus
        run: mise run corpus:fetch

      - name: Check that clickhouse-format runs
        run: mise run oracle:smoke

      # Every input and output of every corpus through clickhouse-format,
      # and every render of every template per combination of its branches;
      # fails on any difference that tests/oracle-allowlist.txt does not list.
      - name: Run the oracle sweep
        env:
          CHAIRLIFT_REQUIRE_CORPUS: "1"
        run: mise run corpus:oracle
