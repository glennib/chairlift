name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: mise install

      - name: Run CI checks
        run: mise run ci

  # Fails when `chairlift::format` got more than 10% slower than at the base
  # commit: the pull request's base, or the commit a push started from. Both
  # are built and timed in this one job; scripts/bench-compare.sh says how
  # the comparison stays steady on a shared runner.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compare the format benchmark with the base commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::notice::no base commit to compare with"
            exit 0
          fi
          scripts/bench-compare.sh "$BASE" 10

  corpus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: mise install

      # The fetch script holds every pin, so its hash is the cache key. An older
      # cache is still restored: the script moves it to the new pins, which is
      # cheaper than a fresh clone.
      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: corpus
          key: corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
          restore-keys: |
            corpus-

      - name: Fetch corpus
        run: scripts/fetch-corpus.sh

      - name: Check the generated keyword list
        run: mise run keywords:check

      # Includes the comparison with ClickHouse's own lexer, built from the
      # fetched source with the runner's clang.
      - name: Run the corpus tests
        run: mise run test:corpus

      # Formats every corpus with a release build: verification and
      # idempotence on every file. The oracle sweep is in oracle.yml.
      - name: Run the corpus tool
        env:
          CHAIRLIFT_REQUIRE_CORPUS: "1"
        run: mise run corpus
