name: Fuzz

# Each fuzz target for 15 minutes on nightly, through the mise tasks. Too slow
# for every push, so it runs weekly and on demand. A crash fails the job and
# its input is uploaded as an artifact; `cargo fuzz run <target> <file>`
# replays it.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target: [lexer, parser, format, doc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache mise
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        run: |
          if [ ! -f ~/.local/bin/mise ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: mise install

      # The inputs a run finds go on from one week to the next. A run saves
      # its corpus under a new key; the latest one is restored.
      - name: Cache fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        run: mise run fuzz:${{ matrix.target }} -- -max_total_time=900

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
