[package]
name = "chairlift"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/glennib/chairlift"
description = "An opinionated, lossless formatter for ClickHouse SQL and Jinja-templated SQL (library + CLI)."
license = "MIT OR Apache-2.0"
authors = ["Glenn Bitar <glennbitar@gmail.com>"]
readme = "README.md"
keywords = ["clickhouse", "sql", "formatter", "jinja", "cli"]
categories = ["command-line-utilities", "development-tools", "database"]
# What builds the library and the binaries, and what the library's own unit
# tests read, so that `cargo test --lib` passes on the published crate. The
# integration tests and benchmarks need corpora that are not published.
include = [
  "/src/**/*.rs",
  "/src/**/*.snap",
  "/tests/fixtures/**",
  "/tests/support/doc_gen.rs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]
default-run = "chl"

[lib]
path = "src/lib.rs"

[[bin]]
name = "chl"
path = "src/bin/chl.rs"
required-features = ["cli"]

[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"
required-features = ["corpus-tool"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "oracle"
path = "tests/oracle.rs"
required-features = ["oracle"]

[[test]]
name = "keyword_positions"
path = "tests/keyword_positions.rs"
required-features = ["oracle"]

[[test]]
name = "corpus_tool"
path = "tests/corpus_tool.rs"
required-features = ["corpus-tool"]

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "printer"
harness = false

[[bench]]
name = "format"
harness = false

[features]
default = ["cli"]
# The `chl` binary. The library needs none of these; a consumer that only
# uses the library can disable default features.
cli = ["dep:clap", "dep:ignore", "dep:miette", "dep:rayon", "dep:similar"]
# `chairlift::oracle`, which runs `clickhouse-format` to check that formatting
# kept a text's meaning. A development and test harness, so unstable too. On
# Unix it needs `libc` to kill the process groups it starts.
oracle = ["dep:libc", "unstable"]
# `chairlift::template`, which renders templates once per combination of
# their branches, as chum does, to check that formatting kept every render.
# A development and test harness, so unstable too; it adds minijinja.
template = ["dep:minijinja", "unstable"]
# The `corpus` binary, a development tool that formats, verifies and checks
# whole directory trees. Not part of the published binary.
corpus-tool = ["cli", "oracle", "template", "unstable"]
# The modules behind `format` (lexer, splitter, parser, layout, document
# printer, verifier) and `format_with_statements`, for chairlift's own tests,
# benchmarks, fuzz targets and corpus tool. No semver guarantee: any release
# may change or remove them.
unstable = []

[dependencies]
# The concrete syntax tree.
rowan = "0.17"
thiserror = "2"
# CLI-only dependencies (gated behind the `cli` feature).
clap = { version = "4.6", features = ["derive"], optional = true }
ignore = { version = "0.4.34", optional = true }
# Per-file diagnostics with source snippets. `fancy-no-syscall` leaves out
# miette's own terminal detection: the CLI decides about colour itself.
miette = { version = "7.6", default-features = false, features = ["fancy-no-syscall"], optional = true }
rayon = { version = "1.12", optional = true }
similar = { version = "2.7", optional = true }
# The renderer behind the `template` feature, at the version chum pins.
minijinja = { version = "~3.1.0", default-features = false, features = ["builtins", "macros", "loop_controls", "fuel"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
# The tests and benchmarks use the unstable modules. A dev-dependency's
# features apply only to the targets built with it, so the library and the
# binary still build without `unstable`.
chairlift = { path = ".", features = ["unstable"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49"
# The oracle for Jinja tag spans. Its tokenizer is behind an unstable feature
# with no semver guarantees, hence the tilde requirement (chum pins the same).
minijinja = { version = "~3.1.0", default-features = false, features = ["unstable_machinery"] }
proptest = "1.12"

[package.metadata.docs.rs]
# The default features: the documented API leaves out `unstable` and the
# `oracle` and `template` harnesses that enable it.
no-default-features = false

[package.metadata.dist]
# Without this, dist would also package the `corpus` development tool.
binaries = { "*" = ["chl"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
doc_markdown = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
