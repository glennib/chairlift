[package]
name = "chairlift"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/glennib/chairlift"
description = "An opinionated, lossless formatter for ClickHouse SQL and Jinja-templated SQL (library + CLI)."
license = "MIT OR Apache-2.0"
authors = ["Glenn Bitar <glennbitar@gmail.com>"]
readme = "README.md"
keywords = ["clickhouse", "sql", "formatter", "jinja", "cli"]
categories = ["command-line-utilities", "development-tools", "database"]
exclude = ["/corpus", "/docs", "/fuzz", "/scripts", "/tests/fixtures"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "chairlift"
path = "src/bin/chairlift.rs"
required-features = ["cli"]

[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"
required-features = ["corpus-tool"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "oracle"
path = "tests/oracle.rs"
required-features = ["oracle"]

[[test]]
name = "keyword_positions"
path = "tests/keyword_positions.rs"
required-features = ["oracle"]

[[test]]
name = "corpus_tool"
path = "tests/corpus_tool.rs"
required-features = ["corpus-tool"]

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "printer"
harness = false

[features]
default = ["cli"]
# The `chairlift` binary. The library needs none of these; a consumer that only
# uses the library can disable default features.
cli = ["dep:clap", "dep:ignore", "dep:similar"]
# `chairlift::oracle`, which runs `clickhouse-format` to check formatting kept
# a text's meaning. No dependencies.
oracle = []
# The `corpus` binary, a development tool that formats, verifies and checks
# whole directory trees. Not part of the published binary.
corpus-tool = ["cli", "oracle"]

[dependencies]
# The concrete syntax tree.
rowan = "0.17"
thiserror = "2"
# CLI-only dependencies (gated behind the `cli` feature).
clap = { version = "4.6", features = ["derive"], optional = true }
ignore = { version = "0.4.34", optional = true }
similar = { version = "2.7", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49"
# The oracle for Jinja tag spans. Its tokenizer is behind an unstable feature
# with no semver guarantees, hence the tilde requirement (chum pins the same).
minijinja = { version = "~3.1.0", default-features = false, features = ["unstable_machinery"] }
proptest = "1.12"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
doc_markdown = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
